<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Prijava</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="stranica">
    <main>
        <div class="kartica">
            <h1>Prijava</h1>

            <p class="poruka greska" th:if="${param.error}">Pogresan email ili lozinka.</p>
            <p class="poruka uspjeh" th:if="${param.logout}">Uspjesno si se odjavio/la.</p>
            <p class="poruka greska" th:if="${param['sesija-istekla']}">Tvoja sesija vise nije vazeca, prijavi se ponovno.</p>

            <form method="post" th:action="@{/login}">

                <label class="polje">
                    <span>Email</span>
                    <input type="email" name="username" required>
                </label>

                <label class="polje">
                    <span>Lozinka</span>
                    <input type="password" name="password" required>
                </label>

                <button type="submit" class="gumb">Prijavi se</button>
            </form>

            <a class="poveznica" href="/registracija">Nemas racun? Registriraj se</a>
        </div>
    </main>
</div>
</body>
</html>
